# coding-stats dogfood (ADR-0006 clause 5): this repo adopts its own actions.
# Every release is proven by this real run.
name: coding-stats

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    # The same branch's runs never overlap; a superseded run abandons at
    # landing (never mid-classification, never red).
    concurrency:
      group: coding-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write  # the Data-branch landing is the only write (GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # walk, blame and partial recompute need full history
      # Dogfood: the action comes from THIS checkout (the pinned-ref rule
      # collapses to the checkout itself).
      - uses: ./
        with:
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}

  report:
    needs: update
    if: ${{ always() && needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: coding-stats-report
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./report
        with:
          deploy-pages: "true"
