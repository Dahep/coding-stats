# coding-stats CI — installed with `coding-stats ci init`;
# upgradable by moving the action ref (manually or via Dependabot).
name: coding-stats

on:
  push:
    branches:
      - 'main'

permissions: {}

jobs:
  # One `uses:` step after checkout — the action pins the engine version to
  # its own checkout, walks, classifies, and lands the Artifact on the
  # Data branch coding-stats/<branch>; the Target branch is never touched.
  update:
    runs-on: ubuntu-latest
    # The same branch's runs never overlap; a superseded run abandons at
    # landing (never mid-classification, never red).
    concurrency:
      group: coding-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write  # the landing commit is the only write (GITHUB_TOKEN)
      id-token: write  # OpenCode service-account sign-in (GitHub OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # walk, blame and partial recompute need full history
      # OpenCode console service account: exchange this job's GitHub OIDC
      # token for a short-lived OpenCode access token (no stored API key).
      - name: Sign in to OpenCode
        id: opencode-signin
        continue-on-error: true  # the deterministic stages still run and land
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_09f4d201-fb17-43e5-bef3-d94dbd0a365c \
            -d subject_token="$oidc" | jq -r .access_token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::OpenCode sign-in returned no access token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"
      # Work repos: pin the commit sha instead of the moving tag — this job
      # holds contents: write and LLM keys.
      - uses: Dahep/coding-stats@v1
        with:
          opencode-api-key: ${{ env.OPENCODE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
      # A failed sign-in fails the job AFTER the artifact landed.
      - name: OpenCode sign-in failed
        if: ${{ steps.opencode-signin.outcome == 'failure' }}
        run: |
          echo "::error::OpenCode service-account sign-in failed; classification was skipped"
          exit 1

  # Reports render on their own cadence (the store holds only the SQL
  # artifact). This job's permissions: checkout/fetch need contents: read;
  # the Pages scopes belong HERE only — the update job never gets them, and
  # they matter only when deploy-pages is "true".
  report:
    needs: update
    if: ${{ always() && needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: coding-stats-report
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write       # needed only for deploy-pages: "true"
      id-token: write    # needed only for deploy-pages: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Dahep/coding-stats/report@v1
        with:
          deploy-pages: "true"  # this repo's per-repo opt-in (publishes the report)
