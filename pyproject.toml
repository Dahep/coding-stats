[project]
name = "coding-stats"
version = "0.1.0"
description = "Mine git history for feature-level metrics: features/year, fixes/feature, churn per feature."
readme = "DESIGN.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
coding-stats = "coding_stats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_stats"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "mypy>=1.19",
    "matplotlib>=3.10",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
